# Render blueprint — the whole stack in one file.
#
#   services:
#     fanhubplus-db   MySQL 8, private service, 10 GB disk, schema on first boot
#     fanhubplus-api  ASP.NET Core 10 web service, talks to the db over the
#                     private network at mysql:3306
#
# Nothing here is a secret. Values marked sync:false are prompts: Render shows an
# empty box and you paste the value in, so a password never exists in this file
# or in git history.
#
# Deploy: push the repo, then in Render choose "New > Blueprint", point it at the
# repository, and Render reads this file.

services:
  # ---------- database ----------
  # `type: pserv` is a PRIVATE service. It has no onrender.com subdomain and is
  # unreachable from the internet; only other services in this workspace can
  # reach it. Declaring it `type: web` would publish it, which is the opposite of
  # what is wanted here.
  #
  # Not a `databases:` entry: Render has no first-party MySQL, so this is the
  # official image with our schema baked in. See deploy/mysql/Dockerfile.
  - type: pserv
    name: fanhubplus-db
    runtime: docker
    dockerfilePath: ./deploy/mysql/Dockerfile
    dockerContext: .
    # There is no free plan for a private service; 0.5c-512mb is the smallest and
    # is also the default if this is omitted. A disk requires a paid plan, which
    # is the only reason this is not free.
    plan: 0.5c-512mb
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql # must match the mysql image exactly
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: fanhubplus
      - key: MYSQL_USER
        value: fanhub
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    # No healthCheckPath. Render's health check is an HTTP GET and MySQL speaks
    # no HTTP, so there is nothing to poll. The container entrypoint is the
    # readiness signal: it runs the schema import and only then starts listening
    # on 3306, so a refused connection means it is genuinely not ready.
    #
    # This is also why the API does not use ServerVersion.AutoDetect — see
    # ServiceCollectionExtensions.
    autoDeployTrigger: 'off'

  # ---------- API ----------
  - type: web
    name: fanhubplus-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Same workspace as the database, so DB_HOST resolves to the private service
    # over Render's internal network. No public database URL is involved.
    #
    # The database is configured with the four discrete DB_* variables rather
    # than a single ConnectionStrings__FanhubPlus. Two reasons: Render's
    # fromService hands over one value at a time, and a generated password can
    # contain a semicolon or an at-sign that would need escaping inside a
    # connection-string URL. ServiceCollectionExtensions assembles the string.
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # The database's private-network hostname.
      #
      # It is NOT the service name. Render appends a random suffix — the docs'
      # own example is `elasticsearch-2j3e:9200` for a service named
      # `elasticsearch` — so a hardcoded `fanhubplus-db` would never resolve.
      # The `host` property is the supported way to read it, and it re-syncs
      # whenever the reference changes.
      #
      # `property: port` is deliberately NOT used: it returns the port of the
      # service's HTTP server, and MySQL has none. It listens on 3306.
      - key: DB_HOST
        fromService:
          name: fanhubplus-db
          type: pserv
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: fanhubplus
      - key: DB_USER
        value: fanhub
      - key: DB_PASSWORD
        fromService:
          name: fanhubplus-db
          type: pserv
          envVarKey: MYSQL_PASSWORD
      # The connection string is assembled in ServiceCollectionExtensions from
      # DB_* because the password contains characters that are awkward in a URL.
      #
      # The JWT signing key. This MUST be named Jwt__Key: Program.cs reads
      # Configuration["Jwt:Key"] and throws at startup if it is absent, and
      # ASP.NET Core maps a configuration section to an environment variable by
      # replacing every colon with a double underscore. JWT__SigningKey looks
      # right and is silently ignored, which crash-loops the API on boot.
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: FanHubPlus
      - key: Jwt__Audience
        value: FanHubPlusClient
      - key: Jwt__ExpiryHours
        value: "8"
      # CORS is a list, so each entry is its own key. Add one per deployed
      # frontend origin — see docs/deployment.md.
      #
      # The origin is scheme + host + port with NO trailing slash. The browser
      # sends the origin it is actually on, which never has one, so
      # "https://x.vercel.app/" does not match "https://x.vercel.app" and the
      # request is refused while /health still answers.
      - key: Cors__Origins__0
        value: http://localhost:5180
      - key: Cors__Origins__1
        value: https://fan-hub-artelligence-t-7.vercel.app
      # Vercel gives every preview deployment its own origin, so a preview build
      # is blocked by the list above. Those URLs are not predictable from here —
      # copy the one from the Vercel preview page and add it as Cors__Origins__2.
    autoDeployTrigger: commit
