<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FanHub Plus — Anime, Gaming, Movies, K-Pop, Comics, Manga & Cosplay</title>
  <meta
    name="description"
    content="FanHub Plus is a fan hub for eight fandoms — Anime, Gaming, Movies, TV Shows, K-Pop, Comics, Manga and Cosplay. Browse and rate titles, read features and character profiles, track conventions and events, save bookmarks, and share your own write-ups."
  />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="FanHub Plus" />
  <meta property="og:title" content="FanHub Plus — the hub for eight fandoms" />
  <meta
    property="og:description"
    content="Browse, rate and save titles across Anime, Gaming, Movies, TV Shows, K-Pop, Comics, Manga and Cosplay, with features, character profiles, events and fan submissions."
  />
  <meta property="og:image" content="/logo.svg" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="FanHub Plus — the hub for eight fandoms" />
  <meta
    name="twitter:description"
    content="Browse, rate and save titles across Anime, Gaming, Movies, TV Shows, K-Pop, Comics, Manga and Cosplay."
  />
  <meta name="twitter:image" content="/logo.svg" />

  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <link rel="mask-icon" href="/logo.svg" color="#862AEC" />
  <meta name="theme-color" content="#862AEC" />
  <meta name="application-name" content="FanHub Plus" />
  <meta name="apple-mobile-web-app-title" content="FanHub Plus" />

  <script>
    // Apply the saved dark-mode choice BEFORE the app loads,
    // so the page doesn't flash white for dark-mode users.
    var saved = null;
    try { saved = localStorage.getItem('fanhub-theme'); } catch (e) { /* storage blocked */ }
    var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (isDark) document.documentElement.classList.add('dark');
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
