<?xml version="1.0" encoding="UTF-8"?>
<!--
  Manga category banner — GENERATED, NOT PHOTO.

  Manga is the one category that arrived without supplied artwork, so rather than
  leave it as a bare gradient next to seven photographs, this is drawn: manga
  visual language (speed lines, screentone, panel grid) in the site palette.

  It is deliberately abstract. A generated illustration of a fictional character
  would misrepresent the category; a panel-and-screentone composition reads as
  "manga" without claiming to be a specific title.

  To replace it with a real photograph: drop a 1600x900 JPEG at
  public/images/categories/manga.jpg, then point CATEGORY_BANNERS.manga at that
  path (src/lib/categoryBanners.ts). The two are interchangeable — these are CSS
  backgrounds, so either extension paints the same way.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Manga">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#2B0A55"/>
      <stop offset="0.5" stop-color="#1A0740"/>
      <stop offset="1"   stop-color="#0C0322"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.72" cy="0.34" r="0.6">
      <stop offset="0"   stop-color="#B62BF0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7A18D8" stop-opacity="0.16"/>
      <stop offset="1"   stop-color="#7A18D8" stop-opacity="0"/>
    </radialGradient>

    <!-- Screentone. A tiling dot pattern, the way printed manga shades a panel. -->
    <pattern id="tone" width="14" height="14" patternUnits="userSpaceOnUse"
             patternTransform="rotate(30)">
      <circle cx="3"  cy="3"  r="2.1" fill="#C77DFF" fill-opacity="0.30"/>
      <circle cx="10" cy="10" r="2.1" fill="#C77DFF" fill-opacity="0.30"/>
    </pattern>

    <pattern id="toneFine" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.15" fill="#E5C4FF" fill-opacity="0.26"/>
    </pattern>

    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0C0322" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#0C0322" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#0C0322" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Declared before it is referenced below. A forward reference to a
         clipPath happens to work in most renderers, but relying on it is how a
         panel outline ends up filled edge-to-edge on the one browser that
         resolves defs in document order. -->
    <clipPath id="panels">
      <rect x="150" y="140" width="470" height="300" rx="6"/>
      <rect x="660" y="140" width="300" height="300" rx="6"/>
      <rect x="150" y="480" width="810" height="270" rx="6"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Speed lines. Radiating from the upper right focal point, thinning
       outward, which is the standard manga impact/zoom device. -->
  <g stroke="#D9A6FF" stroke-opacity="0.22" fill="none" stroke-linecap="round">
    <g transform="translate(1150 300)">
      <path d="M 0 0 L -1500 -430" stroke-width="3"/>
      <path d="M 0 0 L -1500 -320" stroke-width="2"/>
      <path d="M 0 0 L -1500 -215" stroke-width="4"/>
      <path d="M 0 0 L -1500 -120" stroke-width="2"/>
      <path d="M 0 0 L -1500  -30" stroke-width="3"/>
      <path d="M 0 0 L -1500   70" stroke-width="2"/>
      <path d="M 0 0 L -1500  175" stroke-width="4"/>
      <path d="M 0 0 L -1500  285" stroke-width="2"/>
      <path d="M 0 0 L -1500  400" stroke-width="3"/>
      <path d="M 0 0 L -1500  520" stroke-width="2"/>
      <path d="M 0 0 L  450  -700" stroke-width="3"/>
      <path d="M 0 0 L  450  -430" stroke-width="2"/>
      <path d="M 0 0 L  450  -170" stroke-width="3"/>
      <path d="M 0 0 L  450   90" stroke-width="2"/>
      <path d="M 0 0 L  450   360" stroke-width="3"/>
      <path d="M 0 0 L  450   640" stroke-width="2"/>
    </g>
  </g>

  <!-- Panel grid. The left two-thirds is a stack of panels, as on a manga page,
       with the text-safe area kept clear on the far left for the overlay. -->
  <g stroke="#EBD4FF" stroke-opacity="0.30" stroke-width="3" fill="none">
    <rect x="150" y="140" width="470" height="300" rx="6"/>
    <rect x="660" y="140" width="300" height="300" rx="6"/>
    <rect x="150" y="480" width="810" height="270" rx="6"/>
  </g>

  <!-- Screentone inside the panels, clipped to them so it does not bleed. -->
  <g clip-path="url(#panels)">
    <rect x="150" y="140" width="470" height="300" fill="url(#tone)"/>
    <rect x="660" y="140" width="300" height="300" fill="url(#toneFine)"/>
    <rect x="150" y="480" width="810" height="270" fill="url(#tone)"/>
  </g>

  <!-- A silhouette standing in the wide panel: a figure, not a character, so it
       implies "people in panels" without inventing a face. -->
  <g fill="#0A0220" fill-opacity="0.55">
    <ellipse cx="300" cy="292" rx="34" ry="40"/>
    <path d="M 300 332 c -46 0 -78 30 -84 78 l -10 78 h 188 l -10 -78 c -6 -48 -38 -78 -84 -78 z"/>
  </g>
  <g fill="#0A0220" fill-opacity="0.45">
    <ellipse cx="560" cy="300" rx="27" ry="32"/>
    <path d="M 560 332 c -36 0 -60 24 -65 60 l -8 62 h 146 l -8 -62 c -5 -36 -29 -60 -65 -60 z"/>
  </g>

  <!-- Ground the composition: keeps the lower third dark so a headline over it
       stays readable without needing a heavy scrim. -->
  <rect y="520" width="1600" height="380" fill="url(#fadeDown)"/>
</svg>
