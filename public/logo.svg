<?xml version="1.0" encoding="UTF-8"?>
<!--
  FanHub Plus wordmark — hand-authored vector reconstruction of the supplied
  raster logo.

  NOT a pixel-exact trace. Auto-tracing a rasterised logo with a gradient
  produces thousands of nodes and a file larger than the PNG it came from, so
  the letterforms, the orbit and the sparkle are re-drawn as deliberate geometry.
  Proportions are matched to the original; treat this as a redraw rather than a
  lossless conversion, and check it against the raster at favicon size (32px)
  before shipping it as the canonical mark.

  Structure, back to front:
    1. orbit   — the parts that pass behind the letters
    2. letters — F, A, crossbar, play triangle
    3. orbit   — the sweep that passes in front, along the bottom
    4. sparkle

  One gradient runs across the whole mark in user space rather than per shape, so
  the lighting stays consistent and the letters read as a single object.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500"
     role="img" aria-labelledby="fh-title">
  <title id="fh-title">FanHub Plus</title>

  <defs>
    <linearGradient id="fh-brand" gradientUnits="userSpaceOnUse"
                    x1="400" y1="110" x2="120" y2="410">
      <stop offset="0"    stop-color="#B62BF0"/>
      <stop offset="0.45" stop-color="#6A18D2"/>
      <stop offset="1"    stop-color="#17093C"/>
    </linearGradient>

    <linearGradient id="fh-orbit" gradientUnits="userSpaceOnUse"
                    x1="470" y1="200" x2="60" y2="380">
      <stop offset="0"    stop-color="#A625F0"/>
      <stop offset="0.5"  stop-color="#4A12A8"/>
      <stop offset="1"    stop-color="#140834"/>
    </linearGradient>
  </defs>

  <!-- 1. Orbit, behind the letters: a tilted ellipse, open at the top-right
          where the sparkle sits. -->
  <path d="M 452 246
           C 470 300, 430 356, 330 378
           C 214 404, 92 380, 56 328
           C 28 288, 62 236, 132 214"
        fill="none" stroke="url(#fh-orbit)" stroke-width="15" stroke-linecap="round"/>

  <!-- 2. Letterforms. Italic, so each stem's top sits to the right of its foot.
          The slant is baked into the coordinates rather than applied as a skew,
          which keeps the counters clean at any scale. -->
  <g fill="url(#fh-brand)">
    <!-- F -->
    <path d="M 156 114 L 316 114 L 302 151 L 199 151 L 189 204 L 253 204
             L 239 241 L 179 241 L 158 343 L 98 343 Z"/>

    <!-- A, right-hand stem: a near-vertical bar from the apex to the base. -->
    <path d="M 372 156 L 428 168 L 424 404 L 366 404 Z"/>

    <!-- A, left diagonal, from the apex down-left to the base. -->
    <path d="M 352 152 L 396 162 L 292 404 L 238 404 Z"/>

    <!-- The crossbar. Oversized on purpose: it is the ligature tying the A back
         to the F's foot, and a short one leaves the two letters looking like
         separate objects. -->
    <path d="M 108 345 L 372 345 L 368 404 L 100 404 Z"/>

    <!-- Play triangle, sitting in the A's counter. -->
    <path d="M 250 226 L 322 264 L 250 302 Z"/>
  </g>

  <!-- 3. Orbit, in front. Only the sweep across the foot of the letters, redrawn
          on top so the ring visibly passes in front of them. -->
  <path d="M 56 328
           C 92 380, 214 404, 330 378
           C 430 356, 470 300, 452 246"
        fill="none" stroke="url(#fh-orbit)" stroke-width="15" stroke-linecap="round"/>

  <!-- 4. Sparkle. A concave-sided four-point star, not a plain diamond: the
          inward curve on each edge is what makes it read as a glint. -->
  <path d="M 424 96
           C 430 128, 442 140, 470 146
           C 442 152, 430 164, 424 196
           C 418 164, 406 152, 378 146
           C 406 140, 418 128, 424 96 Z"
        fill="url(#fh-brand)"/>
</svg>
